{% extends 'base.html' %}
{% block title %}Supprimer une spécialité{% endblock %}

{% block content %}
<div class="container mt-4 text-center">
    <div class="card p-4 shadow-sm">
        <h3>Voulez-vous vraiment supprimer <strong>{{ specialite.nom }}</strong> ?</h3>
        <p class="text-muted">Cette action est irréversible.</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger me-2">Oui, supprimer</button>
            <a href="{% url 'liste_specialites' %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
