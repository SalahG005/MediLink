{% extends 'base.html' %}
{% load static %}
{% block title %}Calendrier des Rendez-vous{% endblock %}
<style>

        /* Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .navbar .nav-link {
            color: #1b1c74;
            font-weight: 500;
        }
        .navbar .nav-link:hover {
            color: #1b1c74;
        }
        .navbar .text-danger:hover {
            color: #b30000;
        }
        </style>
{% block content %}
  <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="{% url 'acceuil_patient' %}"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{% url 'acceuil_patient' %}">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'rendezvous:calendrier' %}">Calendrier</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'rendezvous:mes_rendezvous' %}">Mes Rendez-vous</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="{% url 'logout' %}">Déconnexion</a></li>
                </ul>
            </div>
        </div>
    </nav>
<div class="container py-5">
  <div class="card shadow-lg border-0 rounded-4">
    <div class="card-body p-4">
      <h2 class="text-center mb-4 fw-bold text-primary">
        Choisissez votre créneau disponible
      </h2>
      <div id="calendar"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<!-- FullCalendar CSS & JS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        selectable: false,
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: [
            {% for slot in slots %}
            {
                title: "{{ slot.is_available|yesno:'Disponible,Réservé' }}",
                start: "{{ slot.date|date:'c' }}",
                color: "{% if slot.is_available %}#28a745{% else %}#dc3545{% endif %}",
                url: "{% if slot.is_available %}{% url 'rendezvous:prendre_rendezvous' slot.id %}{% endif %}"
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
        ],
        eventClick: function(info) {
            if (info.event.url) {
                info.jsEvent.preventDefault();
                const confirmed = confirm("Voulez-vous prendre rendez-vous à cette date ?");
                if (confirmed) {
                    window.location.href = info.event.url;
                }
            } else {
                alert("❌ Ce créneau est déjà réservé");
            }
        }
    });

    calendar.render();
});
</script>

<style>
/* Assure une hauteur pour que le calendrier s'affiche */
#calendar {
    max-width: 900px;
    margin: 0 auto;
    height: 600px;
}
</style>
{% endblock %}
