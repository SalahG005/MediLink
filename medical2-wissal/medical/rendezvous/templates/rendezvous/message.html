{% extends 'base.html' %}

{% block title %}Message{% endblock %}

{% block content %}
<style>
.message-card {
    max-width: 600px;
    margin: 60px auto;
    background-color: #fff;
    border-radius: 20px;
    padding: 40px 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    text-align: center;
}

.message-card h4 {
    color: #1b1c74;
    font-weight: 600;
    margin-bottom: 20px;
}

.message-card p {
    color: #555;
    font-size: 1.1rem;
    margin-bottom: 30px;
}

.btn-custom {
    background: linear-gradient(90deg, #1b1c74, #272894);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 12px 35px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: 0.3s;
}

.btn-custom:hover {
    background: linear-gradient(90deg, #272894, #1b1c74);
    transform: scale(1.05);
}
</style>

<div class="message-card">
    <h4> Rendez-vous confirmé avec succès !</h4>
    <p>Merci d’avoir réservé votre créneau.</p>
    <a href="{% url 'rendezvous:calendrier' %}" class="btn-custom">↩Retour au calendrier</a>
</div>
{% endblock %}
