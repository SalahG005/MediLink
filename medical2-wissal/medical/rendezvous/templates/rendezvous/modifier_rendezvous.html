{% extends 'base.html' %}
{% block title %}Modifier mon rendez-vous{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="text-center mb-4">🕒 Modifier mon rendez-vous</h2>

  <p>Rendez-vous actuel : <strong>{{ rdv.slot.date }} à {{ rdv.slot.start_time }}</strong></p>

  <form method="POST">
    {% csrf_token %}
    <label for="new_slot_id">Choisir un nouveau créneau :</label>
    <select name="new_slot_id" id="new_slot_id" class="form-select mb-3" required>
      {% for slot in available_slots %}
        <option value="{{ slot.id }}">{{ slot.date }} à {{ slot.start_time }}</option>
      {% endfor %}
    </select>

    <button type="submit" class="btn btn-primary w-100">Mettre à jour</button>
  </form>
</div>
{% endblock %}
