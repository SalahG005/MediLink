<!-- templates/users/signin.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - MediLink</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e8f3ff, #f6fcff);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MAIN WRAPPER */
        .container-creative {
            width: 85%;
            max-width: 1150px;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* LEFT COLUMN */
        .left-col {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-card {
            width: 100%;
            max-width: 400px;
        }

        .custom-card h1 {
            text-align: center;
            font-weight: 600;
            color: #1b1c74;
            margin-bottom: 25px;
        }

        .alert {
            background: #ffe5e5;
            color: #b30000;
            padding: 10px 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }

        /* FORM INPUTS */
        label {
            font-weight: 500;
            margin-top: 10px;
            color: #1b1c74;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #d0d7e2;
            margin-top: 6px;
            transition: border 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: #1b1c74;
            box-shadow: 0 0 5px rgba(27,28,116,0.3);
        }

        /* RADIO BUTTON GROUP */
        .radio-group {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .radio-group label {
            font-weight: 500;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .radio-group input[type="radio"] {
            display: none;
        }

        .radio-group input[type="radio"]:checked + label {
            background: #1b1c74;
            color: white;
            transform: scale(1.05);
        }

        /* BUTTON */
        .btn-custom {
            background: linear-gradient(90deg, #1b1c74, #272894);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
            color: white;
        }

        /* SIGNUP LINKS */
        .signup-buttons {
            text-align: center;
            margin-top: 15px;
        }

        .signup-buttons a {
            display: block;
            margin: 5px 0;
            font-weight: 500;
            color: #1b1c74;
            padding: 8px;
            border-radius: 10px;
            transition: 0.2s;
            background: #eef4ff;
        }

        .signup-buttons a:hover {
            background: #d8e6ff;
        }

        /* RETURN BUTTON */
        .btn-return {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 22px;
            border: 2px solid #1b1c74;
            border-radius: 50px;
            color: #1b1c74;
            font-weight: 500;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-return:hover {
            background: #1b1c74;
            color: white;
        }

        /* RIGHT COLUMN IMAGE */
        .right-col {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .side-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .diagonal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(27, 28, 116, 0.15);
            backdrop-filter: blur(2px);
        }

        @media(max-width: 950px) {
            .container-creative {
                flex-direction: column-reverse;
            }

            .right-col {
                height: 250px;
            }
        }
    </style>

</head>
<body>

<div class="container-creative">

    <!-- LEFT SIDE: LOGIN FORM -->
    <div class="left-col">
        <div class="custom-card">
            <h1>Connexion</h1>

            {% if error %}
                <p class="alert">{{ error }}</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <label>Email :</label>
                <input type="email" name="email" placeholder="Votre email" required>

                <label>Mot de passe :</label>
                <input type="password" name="password" placeholder="Votre mot de passe" required>

                <label>Je suis :</label>
                <div class="radio-group">
                    <input type="radio" id="patient" name="role" value="patient" checked>
                    <label for="patient">Patient</label>

                    <input type="radio" id="medecin" name="role" value="medecin">
                    <label for="medecin">Médecin</label>

                    <input type="radio" id="admin" name="role" value="admin">
                    <label for="admin">Admin</label>
                </div>

                <div style="text-align:center; margin-top:25px;">
                    <button type="submit" class="btn-custom">Se connecter</button>
                </div>
            </form>

            <p class="text-center mt-4 fw-semibold">Pas de compte ?</p>

            <div class="signup-buttons">
                <a href="{% url 'signup_patient' %}">➕ S'inscrire en tant que Patient</a>
                <a href="{% url 'signup_medecin' %}">➕ S'inscrire en tant que Médecin</a>
            </div>

           

        </div>
    </div>

    <!-- RIGHT SIDE: IMAGE -->
    <div class="right-col">
        <img src="{% static 'images/medical.jpg' %}" alt="Medical" class="side-image">
        <div class="diagonal-overlay"></div>
    </div>

</div>

</body>
</html>
