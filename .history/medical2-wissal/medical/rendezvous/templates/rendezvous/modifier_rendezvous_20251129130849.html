{% extends 'base.html' %}
{% block title %}Modifier mon rendez-vous{% endblock %}

{% block content %}
<style>
.container-full {
    width: 100%;
    padding: 40px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
}

.custom-card {
    background-color: #fff;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    max-width: 600px;
    width: 100%;
}

h2 {
    text-align: center;
    color: #1b1c74;
    margin-bottom: 25px;
}

form label {
    font-weight: 600;
    color: #1b1c74;
    margin-bottom: 8px;
    display: block;
}

form select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    margin-bottom: 20px;
    background: #f8f9ff;
    font-size: 1rem;
}

.btn-custom {
    background: linear-gradient(90deg, #1b1c74, #272894);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 12px 35px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: 0.3s;
}

.btn-custom:hover {
    background: linear-gradient(90deg, #272894, #1b1c74);
    transform: scale(1.05);
}

.current-slot {
    background: #f0f4ff;
    padding: 12px 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-weight: 500;
    color: #1b1c74;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}
   .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .navbar .nav-link {
            color: #1b1c74;
            font-weight: 500;
        }
        .navbar .nav-link:hover {
            color: #272894;
        }
        .navbar .text-danger:hover {
            color: #b30000;
        }

</style>
 <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="{% url 'acceuil_patient' %}"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{% url 'acceuil_patient' %}">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'rendezvous:calendrier' %}">Calendrier</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'rendezvous:mes_rendezvous' %}">Mes Rendez-vous</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="{% url 'logout' %}">Déconnexion</a></li>
                </ul>
            </div>
        </div>
    </nav>

<div class="container-full py-5">
    <div class="custom-card">
        <h2>Modifier mon rendez-vous</h2>

        <div class="current-slot">
            Rendez-vous actuel : <strong>{{ rdv.slot.date }} à {{ rdv.slot.start_time }}</strong>
        </div>

        <form method="POST">
            {% csrf_token %}
            <label for="new_slot_id">Choisir un nouveau créneau :</label>
            <select name="new_slot_id" id="new_slot_id" required>
                {% for slot in available_slots %}
                    <option value="{{ slot.id }}">{{ slot.date }} à {{ slot.start_time }}</option>
                {% endfor %}
            </select>

            <button type="submit" class="btn-custom w-100">Mettre à jour</button>
        </form>
    </div>
</div>
{% endblock %}
