<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Accueil</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    /* Navbar */
    .navbar {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .navbar .nav-link {
        color: #1b1c74;
        font-weight: 500;
    }
    .navbar .nav-link:hover {
        color: #272894;
    }
    .navbar .text-danger:hover {
        color: #b30000;
    }

    /* Notifications */
    .notif-badge {
        position: absolute;
        top: 0;
        right: 0;
        font-size: 0.7rem;
        padding: 0.25em 0.5em;
    }

    #notif-list {
        max-height: 300px;
        overflow-y: auto;
    }

    #notif-list li {
        padding: 5px 10px;
    }

    #notif-list a.dropdown-item {
        font-size: 0.85rem;
        line-height: 1.2;
        white-space: normal;
    }

    #notif-list a.dropdown-item:hover {
        background-color: #f0f0f0;
    }
  </style>
</head>
<body>

<!-- Navbar avec notifications -->
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="{% url 'acceuil_patient' %}">🏥 MediLink</a>
    <div class="collapse navbar-collapse justify-content-end">
      <ul class="navbar-nav align-items-center">
        <li class="nav-item"><a class="nav-link" href="{% url 'rendezvous:calendrier' %}">Calendrier</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'rendezvous:mes_rendezvous' %}">Mes rendez-vous</a></li>

        <!-- Notification bell -->
        <li class="nav-item dropdown ms-3 position-relative">
          <a class="nav-link position-relative" href="#" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-bell" style="font-size: 1.4rem;"></i>
            <span id="notif-count" class="badge bg-danger rounded-pill notif-badge" style="display:none;">0</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end p-2" aria-labelledby="notifDropdown" style="min-width: 300px;" id="notif-list">
            <li class="text-center text-muted">Chargement...</li>
          </ul>
        </li>

        <li class="nav-item ms-3"><a class="nav-link text-danger" href="{% url 'logout' %}">Déconnexion</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h1>Bienvenue 👋</h1>
  <p><a href="{% url 'rendezvous:calendrier' %}">Voir le calendrier</a></p>
  <p><a href="{% url 'rendezvous:mes_rendezvous' %}">Mes rendez-vous</a></p>
</div>

<!-- JS Notifications -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script>
function loadNotifications() {
    fetch("{% url 'rendezvous:get_notifications' %}")
    .then(response => response.json())
    .then(data => {
        const notifList = document.getElementById('notif-list');
        const notifCount = document.getElementById('notif-count');
        notifList.innerHTML = '';
        let unreadCount = 0;

        if (!data.notifications || data.notifications.length === 0) {
            notifList.innerHTML = '<li class="text-center text-muted">Aucune notification</li>';
        } else {
            data.notifications.forEach(n => {
                if (!n.is_read) unreadCount++;
                const li = document.createElement('li');
                li.innerHTML = `
                    <a href="{% url 'rendezvous:mes_rendezvous' %}" class="dropdown-item ${n.is_read ? '' : 'fw-bold'}" onclick="markAsRead(${n.id})">
                        ${n.message} <br><small class="text-muted">${new Date(n.created_at).toLocaleString()}</small>
                    </a>
                `;
                notifList.appendChild(li);
            });
        }

        if (unreadCount > 0) {
            notifCount.textContent = unreadCount;
            notifCount.style.display = 'inline-block';
        } else {
            notifCount.style.display = 'none';
        }
    });
}

function markAsRead(notifId) {
    fetch(`/rendezvous/notifications/mark_read/${notifId}/`, { 
        method: 'POST', 
        headers: {'X-CSRFToken': '{{ csrf_token }}'} 
    }).then(() => loadNotifications());
}

document.getElementById('notifDropdown')?.addEventListener('click', () => {
    fetch(`/rendezvous/notifications/mark_all_read/`, { 
        method: 'POST', 
        headers: {'X-CSRFToken': '{{ csrf_token }}'} 
    }).then(() => loadNotifications());
});

document.addEventListener('DOMContentLoaded', () => {
    loadNotifications();
    setInterval(loadNotifications, 10000);
});
</script>

</body>
</html>
