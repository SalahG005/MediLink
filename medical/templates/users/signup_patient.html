<!-- templates/users/signup_patient.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription Patient</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/signup_patient.css' %}">
</head>
<body>
    <div class="container">
        <div class="custom-card">
            <h1>Inscription Patient</h1>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="form-btn">
                    <button type="submit" class="btn-patient">S'inscrire</button>
                </div>
            </form>
            <p class="back-home">
                <a href="{% url 'home' %}">Retour à l'accueil</a>
            </p>
        </div>
    </div>
</body>
</html>
